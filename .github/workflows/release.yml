name: Publish release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm run check
      - name: Verify version and release notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';
          import assert from 'node:assert/strict';
          const pkg = JSON.parse(readFileSync('package.json', 'utf8'));
          assert.match(pkg.version, /^\d+\.\d+\.\d+$/);
          assert.equal(process.env.RELEASE_TAG, `v${pkg.version}`);
          assert.ok(readFileSync(`docs/releases/v${pkg.version}.md`, 'utf8').trim());
          JS
      - name: Package static site
        run: |
          python3 <<'PY'
          from pathlib import Path
          import hashlib, json, zipfile
          version = json.loads(Path('package.json').read_text())['version']
          output = Path('dist')
          output.mkdir()
          archive = output / f'TwitchUsernameChecker-v{version}.zip'
          files = [Path(name) for name in ['index.html', 'styles.css', 'app.js', 'checker.js', 'theme.js', 'LICENSE']]
          files += [path for path in Path('assets').rglob('*') if path.is_file()]
          with zipfile.ZipFile(archive, 'w', compression=zipfile.ZIP_DEFLATED) as package:
              for path in sorted(files):
                  info = zipfile.ZipInfo(path.as_posix(), (2026, 1, 1, 0, 0, 0))
                  info.compress_type = zipfile.ZIP_DEFLATED
                  info.external_attr = 0o100644 << 16
                  package.writestr(info, path.read_bytes())
              marker = zipfile.ZipInfo('.nojekyll', (2026, 1, 1, 0, 0, 0))
              marker.compress_type = zipfile.ZIP_DEFLATED
              marker.external_attr = 0o100644 << 16
              package.writestr(marker, '')
          digest = hashlib.sha256(archive.read_bytes()).hexdigest()
          (output / 'SHA256SUMS').write_text(f'{digest}  {archive.name}\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: release-files
          path: dist/
          if-no-files-found: error
  publish:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-files
          path: dist
      - name: Publish validated release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" dist/*.zip dist/SHA256SUMS \
            --verify-tag --title "Twitch Username Checker $RELEASE_TAG" \
            --notes-file "docs/releases/$RELEASE_TAG.md"
